controller:
  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "lts-jdk17"

  admin:
    username: "admin"
    existingSecret: "jenkins-admin-creds"
    userKey: "jenkins-admin-user"
    passwordKey: "jenkins-admin-password"

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - configuration-as-code:latest
    - kubernetes-credentials-provider:latest

  serviceAccount:
    name: jenkins-sa
    create: true

persistence:
  enabled: true
  storageClass: "ebs-sc"
  size: 10Gi
  accessMode: "ReadWriteOnce"